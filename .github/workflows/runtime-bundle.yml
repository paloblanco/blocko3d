name: Runtime bundle is up to date
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
      - name: Fail if the committed bundle differs from a fresh build
        run: |
          git diff --exit-code runtime/ || {
            echo "::error::runtime/blocky3d.runtime.js is out of date. Run 'npm run build' and commit the result."
            exit 1
          }
