name: Runtime bundle is up to date
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
      - name: Fail if the committed bundle or demo differs from a fresh build
        run: |
          git add -N . && git diff --exit-code runtime/ standalone_demo/ demos/castle.b3d.json ide-sw.js ide.webmanifest icons/ || {
            echo "::error::runtime/blocky3d.runtime.js, standalone_demo/ or the IDE's offline files (ide-sw.js, ide.webmanifest, icons/) are out of date. Run 'npm run build' and commit the result."
            exit 1
          }
