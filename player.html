<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>BLOCKO3D player</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; }
</style>
</head>
<body>
<!-- The same bundled runtime that exported games use, so Run matches Export. It builds the
     screen, touch controls and system buttons (js/shell.js), exactly as in an exported game. -->
<script src="runtime/blocko3d.runtime.js"></script>
<script>
const send = (msg) => parent.postMessage({ source: 'blocko3d-player', ...msg }, '*');
let started = false;

// Turn an error's stack into a line number in the cart's code.
function cartLine(err) {
  const m = /cart\.js:(\d+):(\d+)/.exec((err && err.stack) || '');
  return m ? +m[1] : null;
}

function reportError(err) {
  Blocko3D.stop();
  send({ type: 'error', message: String((err && err.message) || err), line: cartLine(err) });
}

function devSettings() {
  let s = {};
  try { s = JSON.parse(localStorage.getItem('blocko3d.dev')) || {}; } catch { s = {}; }
  return { fps: !!s.fps, nocapture: !!s.nocapture, nooutline: !!s.nooutline };
}

function run(cart) {
  started = true;
  Blocko3D.install(cart, {
    onError: reportError,
    onLog: (text) => send({ type: 'log', text }),
    onSave: (json) => send({ type: 'save', json }),
    onCover: (png) => send({ type: 'cover', png }),   // only the IDE gets 'Capture cover' in the pause menu
    // the IDE's performance toggles (FPS, GIF+Screenshot, Outlines), kept on this device
    dev: devSettings(),
    onDev: (s, reload) => {
      try { localStorage.setItem('blocko3d.dev', JSON.stringify(s)); } catch { /* storage blocked */ }
      if (reload) location.reload();   // the IDE sends the cart again when the player says 'ready'
    },
  });
  // The cart's code becomes a function returning its hooks, so Restart can run it again in place.
  let runCart;
  try {
    runCart = (0, eval)(Blocko3D.cartFunctionSource(cart.code) + '\n//# sourceURL=cart.js');
  } catch (e) { reportError(e); return; }
  if (Blocko3D.start(runCart)) send({ type: 'started' });
}

window.addEventListener('message', (e) => {
  const d = e.data || {};
  if (d.type === 'run' && !started) run(d.cart);
  if (d.type === 'stop') Blocko3D.stop();
});
window.addEventListener('error', (e) => reportError(e.error || e.message));
send({ type: 'ready' });
</script>
</body>
</html>
