<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>blocky3D player</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  #screen { position: absolute; inset: 0; margin: auto; aspect-ratio: 1; width: min(100vw, 100vh); }
  #screen canvas { position: absolute; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; display: block; }
</style>
</head>
<body>
<div id="screen">
  <canvas id="gl" width="256" height="256"></canvas>
  <canvas id="ui" width="256" height="256"></canvas>
</div>
<!-- The same bundled runtime that exported games use, so Run matches Export. -->
<script src="runtime/blocky3d.runtime.js"></script>
<script>
const send = (msg) => parent.postMessage({ source: 'blocky3d-player', ...msg }, '*');
let started = false;

// Turn an error's stack into a line number in the cart's code.
function cartLine(err) {
  const m = /cart\.js:(\d+):(\d+)/.exec((err && err.stack) || '');
  return m ? +m[1] : null;
}

function reportError(err) {
  Blocky3D.stop();
  send({ type: 'error', message: String((err && err.message) || err), line: cartLine(err) });
}

function run(cart) {
  started = true;
  Blocky3D.install(cart, {
    canvas: document.getElementById('gl'),
    overlay: document.getElementById('ui'),
    onError: reportError,
    onLog: (text) => send({ type: 'log', text }),
  });
  let hooks;
  try {
    hooks = (0, eval)(String(cart.code || '') + '\n;' + Blocky3D.HOOKS_EXPR + '\n//# sourceURL=cart.js');
  } catch (e) { reportError(e); return; }
  if (Blocky3D.start(hooks)) send({ type: 'started' });
}

window.addEventListener('message', (e) => {
  const d = e.data || {};
  if (d.type === 'run' && !started) run(d.cart);
  if (d.type === 'stop') Blocky3D.stop();
  // on-screen touch buttons in the IDE arrive as key presses
  if (d.type === 'key') window.dispatchEvent(new KeyboardEvent(d.down ? 'keydown' : 'keyup', { code: d.code }));
});
window.addEventListener('error', (e) => reportError(e.error || e.message));
send({ type: 'ready' });
</script>
</body>
</html>
