<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>blocky3D player</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; }
</style>
</head>
<body>
<!-- The same bundled runtime that exported games use, so Run matches Export. It builds the
     screen, touch controls and system buttons (js/shell.js), exactly as in an exported game. -->
<script src="runtime/blocky3d.runtime.js"></script>
<script>
const send = (msg) => parent.postMessage({ source: 'blocky3d-player', ...msg }, '*');
let started = false;

// Turn an error's stack into a line number in the cart's code.
function cartLine(err) {
  const m = /cart\.js:(\d+):(\d+)/.exec((err && err.stack) || '');
  return m ? +m[1] : null;
}

function reportError(err) {
  Blocky3D.stop();
  send({ type: 'error', message: String((err && err.message) || err), line: cartLine(err) });
}

function run(cart) {
  started = true;
  Blocky3D.install(cart, {
    onError: reportError,
    onLog: (text) => send({ type: 'log', text }),
    onRestart: () => send({ type: 'restart' }),   // the IDE runs the cart again from scratch
    onSave: (json) => send({ type: 'save', json }),
  });
  let hooks;
  try {
    hooks = (0, eval)(String(cart.code || '') + '\n;' + Blocky3D.HOOKS_EXPR + '\n//# sourceURL=cart.js');
  } catch (e) { reportError(e); return; }
  if (Blocky3D.start(hooks)) send({ type: 'started' });
}

window.addEventListener('message', (e) => {
  const d = e.data || {};
  if (d.type === 'run' && !started) run(d.cart);
  if (d.type === 'stop') Blocky3D.stop();
});
window.addEventListener('error', (e) => reportError(e.error || e.message));
send({ type: 'ready' });
</script>
</body>
</html>
